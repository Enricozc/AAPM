<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Esqueci minha senha - AAPM SENAI</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {

            min-height: 100vh;

            margin: 0;

            background:
                linear-gradient(
                    135deg,
                    #004aad,
                    #0066ff 50%,
                    #ff7b00
                );

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

        }

        .card {

            width: 100%;

            max-width: 440px;

            background: white;

            border-radius: 28px;

            padding: 40px;

            box-shadow:
                0 25px 70px rgba(0,0,0,.20);

        }

        .input {

            width: 100%;

            height: 56px;

            border: 2px solid #e5e7eb;

            border-radius: 14px;

            padding: 0 16px;

            outline: none;

            transition: .25s;

        }

        .input:focus {

            border-color: #0066ff;

            box-shadow:
                0 0 0 4px rgba(0,102,255,.10);

        }

        .button {

            width: 100%;

            height: 56px;

            border: none;

            border-radius: 14px;

            background: #ff7b00;

            color: white;

            font-weight: 700;

            cursor: pointer;

            transition: .25s;

        }

        .button:hover {

            background: #ff9100;

            transform: translateY(-2px);

        }

    </style>

</head>

<body>

<div class="card">

    <div class="text-center mb-8">

        <div
            class="w-20 h-20 mx-auto mb-5 rounded-2xl
                   bg-gradient-to-r from-[#004aad] to-[#0066ff]
                   flex items-center justify-center"
        >

            <span class="text-4xl">
                🔐
            </span>

        </div>

        <h1 class="text-3xl font-bold text-slate-800">

            Esqueci minha senha

        </h1>

        <p class="text-slate-500 mt-2">

            Digite seu e-mail para recuperar o acesso.

        </p>

    </div>


    {% if mensagem %}

        <div
            class="mb-5 p-4 rounded-xl
                   bg-green-50 text-green-700
                   text-sm"
        >

            {{ mensagem }}

        </div>

    {% endif %}


    {% if reset_url %}

        <div
            class="mb-5 p-4 rounded-xl
                   bg-blue-50 text-blue-700
                   text-sm"
        >

            <strong>
                Link de recuperação:
            </strong>

            <a
                href="{{ reset_url }}"
                class="block mt-2 break-all underline font-semibold"
            >

                {{ reset_url }}

            </a>

        </div>

    {% endif %}


    <form
        action="/auth/forgot-password"
        method="post"
    >

        <label
            class="block text-sm font-semibold text-slate-700 mb-2"
        >

            E-mail

        </label>

        <input
            type="email"
            name="email"
            class="input mb-5"
            placeholder="seuemail@senai.com"
            required
        >


        <button
            type="submit"
            class="button"
        >

            Enviar recuperação

        </button>

    </form>


    <div class="text-center mt-6">

        <a
            href="/auth/login"
            class="text-blue-600 font-semibold text-sm"
        >

            ← Voltar para o login

        </a>

    </div>

</div>

</body>

</html>
