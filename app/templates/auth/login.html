<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AAPM SENAI</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body{
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

    <nav class="w-full bg-[#0052cc] text-white px-6 md:px-12 py-4 flex justify-between items-center">
        <div class="text-lg font-bold">
            AAPM SENAI
        </div>

        <div>
            <a href="/"
               class="hover:text-gray-200">
                Início
            </a>
        </div>
    </nav>

    <main class="flex-1 flex items-center justify-center">

        <div class="bg-white w-full max-w-md p-8 rounded-lg shadow-lg border-t-4 border-[#0052cc]">

            <h2 class="text-center text-3xl mb-8">
                Área de Acesso
            </h2>

            <form action="/auth/login" method="post">

                <div class="mb-4">
                    <label class="block font-semibold mb-2">
                        E-mail
                    </label>

                    <input
                        type="email"
                        name="email"
                        placeholder="usuario@senai.com.br"
                        class="w-full border rounded p-3"
                        required>
                </div>

                <div class="mb-6">
                    <label class="block font-semibold mb-2">
                        Senha
                    </label>

                    <input
                        type="password"
                        name="senha"
                        placeholder="********"
                        class="w-full border rounded p-3"
                        required>
                </div>

                <button
                    type="submit"
                    class="w-full bg-[#0052cc] hover:bg-blue-700 text-white py-3 rounded font-bold">
                    Entrar
                </button>

            </form>

        </div>

    </main>

</body>
</html>
