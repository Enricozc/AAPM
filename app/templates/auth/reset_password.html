<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>AAPM SENAI - Nova Senha</title>

<script src="https://cdn.tailwindcss.com"></script>

<link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    min-height: 100vh;
}

.bg-system {
    background:
        linear-gradient(
            135deg,
            #004aad 0%,
            #0066ff 50%,
            #ff7b00 100%
        );
}

.card {
    background: white;

    border-radius: 30px;

    box-shadow:
        0 25px 70px rgba(0,0,0,.20);
}

.input-login {

    width: 100%;

    height: 58px;

    border: 2px solid #e7edf7;

    border-radius: 16px;

    padding: 0 18px;

    background: #f8fbff;

    color: #0f172a;

    transition: .3s;
}

.input-login:focus {

    outline: none;

    border-color: #0066ff;

    box-shadow:
        0 0 0 4px rgba(0,102,255,.12);

    background: white;
}

.btn-login {

    width: 100%;

    height: 58px;

    border: none;

    border-radius: 16px;

    background: #ff7b00;

    color: white;

    font-weight: 700;

    cursor: pointer;

    transition: .3s;
}

.btn-login:hover {

    background: #ff9100;

    transform: translateY(-2px);
}

.alert-error {

    background: #fff1f2;

    border: 1px solid #fecdd3;

    color: #be123c;

    padding: 12px 15px;

    border-radius: 14px;

    margin-bottom: 20px;

    font-size: 13px;
}

.password-wrapper {

    position: relative;
}

.password-wrapper .input-login {

    padding-right: 55px;
}

.toggle-password {

    position: absolute;

    right: 14px;

    top: 50%;

    transform: translateY(-50%);

    border: none;

    background: transparent;

    cursor: pointer;

    color: #64748b;

}

.toggle-password:hover {

    color: #0066ff;
}

</style>

</head>


<body class="bg-system flex items-center justify-center px-5">


<div class="card w-full max-w-md p-10">


    <!-- ÍCONE -->

    <div
        class="
            w-20
            h-20
            rounded-3xl
            bg-gradient-to-r
            from-[#004aad]
            to-[#0066ff]
            mx-auto
            flex
            items-center
            justify-center
            mb-6
        "
    >

        <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-10 h-10 text-white"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
        >

            <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 7a3 3 0 11-6 0 3 3 0 016 0z"
            />

            <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M5 21a7 7 0 0114 0"
            />

        </svg>

    </div>


    <h1
        class="
            text-3xl
            font-bold
            text-slate-800
            text-center
        "
    >

        Criar nova senha

    </h1>


    <p
        class="
            text-slate-500
            text-center
            text-sm
            mt-2
            mb-7
        "
    >

        Digite sua nova senha para recuperar
        o acesso ao sistema.

    </p>


    {% if erro %}

    <div class="alert-error">

        {{ erro }}

    </div>

    {% endif %}


    {% if token %}

    <form
        action="/auth/reset-password"
        method="post"
    >

        <!-- TOKEN -->

        <input
            type="hidden"
            name="token"
            value="{{ token }}"
        >


        <!-- NOVA SENHA -->

        <div class="mb-5">

            <label
                class="
                    block
                    text-sm
                    font-semibold
                    text-slate-700
                    mb-2
                "
            >

                Nova senha

            </label>


            <div class="password-wrapper">

                <input
                    id="nova_senha"
                    type="password"
                    name="nova_senha"
                    class="input-login"
                    placeholder="Digite sua nova senha"
                    minlength="6"
                    required
                >


                <button
                    type="button"
                    class="toggle-password"
                    onclick="togglePassword('nova_senha', this)"
                >

                    👁

                </button>

            </div>

        </div>


        <!-- CONFIRMAR -->

        <div class="mb-6">

            <label
                class="
                    block
                    text-sm
                    font-semibold
                    text-slate-700
                    mb-2
                "
            >

                Confirmar senha

            </label>


            <div class="password-wrapper">

                <input
                    id="confirmar_senha"
                    type="password"
                    name="confirmar_senha"
                    class="input-login"
                    placeholder="Digite novamente"
                    minlength="6"
                    required
                >


                <button
                    type="button"
                    class="toggle-password"
                    onclick="togglePassword('confirmar_senha', this)"
                >

                    👁

                </button>

            </div>

        </div>


        <button
            type="submit"
            class="btn-login"
        >

            Alterar minha senha

        </button>

    </form>

    {% else %}

    <a
        href="/auth/login"
        class="
            block
            text-center
            w-full
            py-4
            rounded-2xl
            bg-[#0066ff]
            text-white
            font-semibold
        "
    >

        Voltar para o login

    </a>

    {% endif %}


    <div class="text-center mt-7">

        <span class="text-slate-400 text-sm">

            © 2026 AAPM SENAI

        </span>

    </div>

</div>


<script>

function togglePassword(
    id,
    button
) {

    const input =
        document.getElementById(id);

    if (input.type === "password") {

        input.type = "text";

        button.innerText = "🙈";

    } else {

        input.type = "password";

        button.innerText = "👁";

    }

}

</script>


</body>

</html>
