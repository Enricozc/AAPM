{% extends "base.html" %}

{% block titulo %}
Início - AAPM SENAI
{% endblock %}

{% block conteudo %}

<div class="text-center mb-12">
    <h1 class="text-5xl font-extrabold text-[#0052cc]">
        AAPM SENAI
    </h1>

    <p class="text-gray-500 text-lg mt-4 mb-8">
        Promovendo a integração e assistência na comunidade escolar.
    </p>

    <a href="/auth/login"
       class="bg-[#0052cc] hover:bg-blue-700 text-white font-semibold px-8 py-3 rounded-lg shadow-md transition">
        Acessar Área Restrita
    </a>
</div>

<!-- CARDS APENAS NA PÁGINA INICIAL -->
<section class="w-full max-w-5xl mx-auto bg-white p-8 rounded-2xl shadow-sm border border-gray-100/80">
    <div class="grid grid-cols-2 md:grid-cols-4 gap-8 md:divide-x md:divide-gray-100">

        <div class="flex flex-col items-center p-2">
            <div class="text-[#0052cc] text-2xl bg-blue-50 w-12 h-12 rounded-full flex items-center justify-center mb-3">
                <i class="fa-solid fa-users"></i>
            </div>
            <span class="text-3xl font-extrabold text-[#0052cc]">567</span>
            <span class="text-xs font-bold text-gray-400 uppercase mt-1">
                Membros ativos
            </span>
        </div>

        <div class="flex flex-col items-center p-2">
            <div class="text-orange-500 text-2xl bg-orange-50 w-12 h-12 rounded-full flex items-center justify-center mb-3">
                <i class="fa-solid fa-chart-line"></i>
            </div>
            <span class="text-3xl font-extrabold text-orange-500">
                R$ 45k
            </span>
            <span class="text-xs font-bold text-gray-400 uppercase mt-1">
                Arrecadado em 2026
            </span>
        </div>

        <div class="flex flex-col items-center p-2">
            <div class="text-[#0052cc] text-2xl bg-blue-50 w-12 h-12 rounded-full flex items-center justify-center mb-3">
                <i class="fa-solid fa-lock"></i>
            </div>
            <span class="text-3xl font-extrabold text-[#0052cc]">
                80
            </span>
            <span class="text-xs font-bold text-gray-400 uppercase mt-1">
                Armários Livres
            </span>
        </div>

        <div class="flex flex-col items-center p-2">
            <div class="text-orange-500 text-2xl bg-orange-50 w-12 h-12 rounded-full flex items-center justify-center mb-3">
                <i class="fa-regular fa-star"></i>
            </div>
            <span class="text-3xl font-extrabold text-orange-500">
                98%
            </span>
            <span class="text-xs font-bold text-gray-400 uppercase mt-1">
                Satisfação
            </span>
        </div>

    </div>
</section>

{% endblock %}
