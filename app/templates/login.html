{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="login-box">

    <h1>Login</h1>

    <form action="/login" method="post">

        <input
            type="email"
            name="email"
            placeholder="Digite seu e-mail"
            required
        >

        <input
            type="password"
            name="senha"
            placeholder="Digite sua senha"
            required
        >

        {% if erro %}

        <p class="erro">
            {{ erro }}
        </p>

        {% endif %}

        <button type="submit">
            Entrar
        </button>

    </form>

</div>

{% endblock %}
