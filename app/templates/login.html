<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Área de Login - AAPM SENAI</title>
  
  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>

  <div class="app-container">
    
    <header class="app-header">
      <div class="brand-section">
        
        <svg class="senai-logo" viewBox="0 0 114 43" xmlns="http://www.w3.org/2000/svg">
          <path fill="#f26522" d="M22.9 0c12.7 0 22.9 1.4 22.9 4.3 0 2.9-10.2 4.3-22.9 4.3S0 7.2 0 4.3C0 1.4 10.2 0 22.9 0Zm12.7 8.3c0 1.2-.5 2.1-1.4 2.8-.9.7-2.1 1-3.6 1-1.5 0-2.7-.3-3.6-1-.9-.7-1.4-1.6-1.4-2.8 0-1.2.5-2.1 1.4-2.8.9-.7 2.1-1 3.6-1s2.7.3 3.6 1c.9.7 1.4 1.6 1.4 2.8Zm-12.7 21c7 0 12.7.8 12.7 2.4s-5.7 2.4-12.7 2.4-12.7-.8-12.7-2.4 5.7-2.4 12.7-2.4Zm52.7 12.1h-.1c-.9 0-1.5-.4-1.8-1.1L59.1 10.9h6.1c1.1 0 1.9.7 2.2 1.6l8.3 19 8.3-19c.3-.9 1.1-1.6 2.2-1.6h6.1L78 40.3c-.3.7-.9 1.1-1.8 1.1Zm-40-3.3c0-3.2 2.6-5.8 5.8-5.8h6.1c.8 0 1.5.3 1.9 1l2.4 3.7c1.4-3.1 4.5-5.3 8-5.3 4.9 0 8.8 3.9 8.8 8.8v8.6c0 1.1-.9 1.9-1.9 1.9h-6.1c-1.1 0-1.9-.9-1.9-1.9v-8.6c0-.6-.5-1.1-1.1-1.1s-1.1.5-1.1 1.1v8.6c0 1.1-.9 1.9-1.9 1.9h-6.1c-1.1 0-1.9-.9-1.9-1.9V33Zm24 0c0-1.6-1.3-2.9-2.9-2.9s-2.9 1.3-2.9 2.9 1.3 2.9 2.9 2.9 2.9-1.3 2.9-2.9Zm58.6-25.1L107.8 0H101L96.2 12.6l-2.4-5.2h-3.4L89 12.6 84.1.1H77.2L85 18.2V43h7.8V18.2l7.7-18.2Z"/>
        </svg>

        <div class="aapm-text">
          <p class="aapm-title">AAPM</p>
          <p class="aapm-subtitle">Francisco Matarazzo</p>
        </div>
      </div>
      
      <nav class="nav-links">
        <a href="/" class="nav-link">Ínicio</a>
        <a href="/produtos" class="nav-link">Produtos</a>
      </nav>
      
      <a href="/login" class="login-btn-top active-nav-link">Login</a>
    </header>

    <main class="content-area">
      <h1 class="page-title">Área de Login</h1>
      <p class="page-subtitle">Selecione seu tipo de usuário para continuar</p>

      <div class="admin-badge-card">
        <div class="icon-container">
          <svg class="shield-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path fill="#ffffff" d="M12 2L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-3Zm0 18.99c-3.75-1.01-6.75-4.9-6.75-9.49V6.3l6.75-2.25 6.75 2.25V11.5c0 4.59-3 8.48-6.75 9.49Zm-1-6.99l-2.5-2.5 1.41-1.41L11 12.17l4.09-4.09 1.41 1.41-5.5 5.5Z"/>
          </svg>
        </div>
        <h2 class="card-title">Administração</h2>
        <p class="card-desc">Área exclusiva para gestão da AAPM</p>
      </div>

      {% if erro %}
      <div class="error-message">
        ⚠️ {{ erro }}
      </div>
      {% endif %}

      <form class="login-form" action="/login" method="post">
        
        <div class="form-group">
          <label class="input-label" for="email">E-mail</label>
          <input class="form-input" type="email" id="email" name="email" placeholder="seu.email@exemplo.com" required>
        </div>
        
        <div class="form-group">
          <label class="input-label" for="senha">Senha</label>
          <input class="form-input" type="password" id="senha" name="senha" placeholder="...................." required>
        </div>

        <div class="submit-btn-section">
          <button class="btn-entrar" type="submit">Entrar</button>
        </div>

      </form>
    </main>

  </div>

</body>
</html>
