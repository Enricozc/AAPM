<style>
.wrap{
    display:flex;
    flex-direction:column;
    gap:12px;
}

/* HEADER */
.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.header h3{
    font-size:20px;
    font-weight:900;
    color:#0f172a;
}

/* CARD ITEM (NOVA FORMA) */
.item{
    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:16px 18px;
    background:white;
    border:1px solid #eef2f7;
    border-radius:18px;

    transition:.2s;
}

.item:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 30px rgba(0,0,0,.06);
}

/* LEFT */
.left{
    display:flex;
    flex-direction:column;
    gap:4px;
}

.id{
    font-size:12px;
    color:#94a3b8;
    font-weight:800;
}

.name{
    font-size:15px;
    font-weight:900;
    color:#0f172a;
}

/* STATUS */
.badge{
    font-size:11px;
    font-weight:900;
    padding:6px 10px;
    border-radius:999px;
}

.active{
    background:#dcfce7;
    color:#166534;
}

.inactive{
    background:#fee2e2;
    color:#991b1b;
}

/* ACTIONS */
.actions{
    display:flex;
    gap:8px;
    align-items:center;
}

.edit{
    background:rgba(255,102,0,.12);
    color:#ff6600;
    padding:7px 10px;
    border-radius:10px;
    font-size:12px;
    font-weight:900;
    text-decoration:none;
}

.toggle{
    border:none;
    padding:7px 10px;
    border-radius:10px;
    font-size:12px;
    font-weight:900;
    cursor:pointer;
}

.on{
    background:#10b981;
    color:white;
}

.off{
    background:#ef4444;
    color:white;
}

/* EMPTY */
.empty{
    text-align:center;
    padding:40px;
    color:#94a3b8;
    font-weight:600;
}
</style>

<div class="wrap">

    <div class="header">
        <h3>Categorias</h3>

        <a href="/categorias/nova"
           style="background:#0052cc;color:white;padding:10px 14px;border-radius:12px;font-weight:900;text-decoration:none;">
           + Nova
        </a>
    </div>

    {% for cat in categorias %}

    <div class="item" {% if not cat.ativo %}style="opacity:0.6"{% endif %}>

        <!-- LEFT INFO -->
        <div class="left">
            <div class="id">#{{ cat.id }}</div>
            <div class="name">{{ cat.nome }}</div>
        </div>

        <!-- STATUS -->
        <div>
            {% if cat.ativo %}
                <span class="badge active">Ativo</span>
            {% else %}
                <span class="badge inactive">Inativo</span>
            {% endif %}
        </div>

        <!-- ACTIONS -->
        <div class="actions">

            <a class="edit"
               href="/categorias/{{ cat.id }}/editar">
               Editar
            </a>

            <form action="/categorias/{{ cat.id }}/toggle-ativo"
                  method="POST">

                {% if cat.ativo %}
                    <button class="toggle off" type="submit">
                        Desativar
                    </button>
                {% else %}
                    <button class="toggle on" type="submit">
                        Ativar
                    </button>
                {% endif %}

            </form>

        </div>

    </div>

    {% else %}

        <div class="empty">
            Nenhuma categoria cadastrada
        </div>

    {% endfor %}

</div>
